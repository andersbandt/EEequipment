[pyvisa]
timeout = 1000
write_termination = \r\n
read_termination = \r\n


[command]
read = ?
mode_vdc = F1
mode_vac = F2
mode_res_2 = F3
mode_res_4 = F4
mode_idc = F5
mode_iac = F6
get_mode = G0
range_auto = R0
range_1 = R2
range_2 = R3
range_3 = R5


[range_labels]
range_1 = 2V
range_2 = 20V
range_3 = 700V AC / 1kV DC


[capabilities]
secondary_display = false
get_range = G0
rate_slow = S0
rate_medium = S1
rate_fast = S2
error = G7
error_clear = X0
query = G8
status = G0
reset = *
