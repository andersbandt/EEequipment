# Tektronix MSO64 (6 Series MSO, 4 analog channels).
#
# This is the TekScope command set, NOT the Keysight/InfiniiVision one used by
# DSOX4104A -- the two dialects disagree on almost everything, so do not copy
# lines between the files. Where a command has no Tek equivalent with the same
# semantics (waveform preamble, measurements, screenshot transfer, horizontal
# position units) the key is deliberately absent and MSO64.py overrides the
# method instead.

[pyvisa]
# Screenshots go via a save-to-scope-disk + file read round trip, which is
# slower than a single query -- hence the longer timeout than the Keysight.
timeout = 15000
write_termination = \n
read_termination = \n


[command]
# === System / IEEE 488.2 ===
query = *IDN?
reset = *RST
clear = *CLS
self_test = *TST?
error = EVMsg?
status = *ESE {mask}
opc = *OPC?

# === Autoscale ===
autoscale = AUTOSet EXECute

# === Channel ===
# DISplay:GLObal is the 4/5/6 Series way to show/hide a channel; the older
# SELect:CH<n> only affects the currently selected waveform view.
chan_display_on = DISplay:GLObal:CH{channel}:STATE ON
chan_display_off = DISplay:GLObal:CH{channel}:STATE OFF
chan_get_display = DISplay:GLObal:CH{channel}:STATE?
chan_coupling = CH{channel}:COUPling {coupling}
chan_get_coupling = CH{channel}:COUPling?
chan_scale = CH{channel}:SCAle {scale}
chan_get_scale = CH{channel}:SCAle?
chan_offset = CH{channel}:OFFSet {offset}
chan_get_offset = CH{channel}:OFFSet?
chan_probe = CH{channel}:PROBEFunc:EXTAtten {ratio}
chan_get_probe = CH{channel}:PROBEFunc:EXTAtten?
chan_bw_limit_on = CH{channel}:BANdwidth 20.0E+6
chan_bw_limit_off = CH{channel}:BANdwidth FULl
chan_get_bw_limit = CH{channel}:BANdwidth?
chan_impedance = CH{channel}:TERmination {impedance}
chan_get_impedance = CH{channel}:TERmination?
chan_label = CH{channel}:LABel:NAMe "{label}"
chan_get_label = CH{channel}:LABel:NAMe?

# === Timebase ===
timebase_scale = HORizontal:SCAle {scale}
timebase_get_scale = HORizontal:SCAle?
# Tek expresses this as a percentage of the record, not seconds of delay --
# MSO64.set_timebase_position converts before sending.
timebase_position = HORizontal:POSition {position}
timebase_get_position = HORizontal:POSition?
timebase_mode = HORizontal:MODE {mode}
timebase_get_mode = HORizontal:MODE?

# === Trigger ===
# On Tek, TYPe is the trigger kind (EDGE/PULSe/...) and MODe is auto vs normal,
# which is the opposite naming to Keysight. Keys are mapped by meaning:
# trig_mode -> type, trig_sweep -> auto/normal.
trig_mode = TRIGger:A:TYPe {mode}
trig_get_mode = TRIGger:A:TYPe?
trig_source = TRIGger:A:EDGE:SOUrce {source}
trig_get_source = TRIGger:A:EDGE:SOUrce?
trig_level = TRIGger:A:LEVel:CH{channel} {level}
trig_get_level = TRIGger:A:LEVel:CH{channel}?
trig_slope = TRIGger:A:EDGE:SLOpe {slope}
trig_get_slope = TRIGger:A:EDGE:SLOpe?
trig_coupling = TRIGger:A:EDGE:COUPling {coupling}
trig_get_coupling = TRIGger:A:EDGE:COUPling?
trig_sweep = TRIGger:A:MODe {sweep}
trig_get_sweep = TRIGger:A:MODe?
trig_force = TRIGger FORCe

# === Acquisition ===
acq_run = ACQuire:STATE RUN
acq_stop = ACQuire:STATE STOP
acq_single = ACQuire:STOPAfter SEQuence;:ACQuire:STATE RUN
# Undoes the STOPAfter SEQuence that acq_single leaves behind -- see MSO64.run
acq_run_continuous = ACQuire:STOPAfter RUNSTop
acq_type = ACQuire:MODe {acq_type}
acq_get_type = ACQuire:MODe?
acq_count = ACQuire:NUMAVg {count}
acq_get_count = ACQuire:NUMAVg?
acq_srate = HORizontal:MODE:SAMPLERate?
acq_points = HORizontal:MODE:RECOrdlength {points}
acq_get_points = HORizontal:MODE:RECOrdlength?

# === Measurements ===
# The 6 Series has no immediate-measurement query; every measurement is an
# object that must be added, configured, read and removed. MSO64 does that in
# _measure_immediate(), so only the plumbing lives here.
meas_list = MEASUrement:LIST?
meas_add = MEASUrement:ADDNew "MEAS{slot}"
meas_delete = MEASUrement:DELete "MEAS{slot}"
meas_type = MEASUrement:MEAS{slot}:TYPe {meas_type}
meas_source = MEASUrement:MEAS{slot}:SOUrce CH{channel}
meas_source2 = MEASUrement:MEAS{slot}:SOUrce2 CH{channel}
meas_result = MEASUrement:MEAS{slot}:RESUlts:CURRentacq:MEAN?
measure_clear = MEASUrement:DELETEALL

# === Waveform Data Transfer ===
wav_source = DATa:SOUrce CH{channel}
wav_format = DATa:ENCdg {fmt}
wav_start = DATa:STARt 1
wav_stop = DATa:STOP {points}
wav_bytes = WFMOutpre:BYT_Nr {width}
wav_get_data = CURVe?
wav_x_incr = WFMOutpre:XINcr?
wav_x_zero = WFMOutpre:XZEro?
wav_y_mult = WFMOutpre:YMUlt?
wav_y_off = WFMOutpre:YOFf?
wav_y_zero = WFMOutpre:YZEro?
wav_points = WFMOutpre:NR_Pt?

# === Display ===
display_clear = CLEAR
display_persist_on = DISplay:PERSistence INFPersist
display_persist_off = DISplay:PERSistence OFF
display_get_persist = DISplay:PERSistence?
display_graticule = DISplay:WAVEView1:GRIDtype {style}
display_get_graticule = DISplay:WAVEView1:GRIDtype?

# === Save / Screenshot ===
# The scope can only write an image to its own filesystem; getting it onto the
# host is a second step (FILESystem:READFile) -- see MSO64.get_screenshot.
save_image = SAVe:IMAGe "{filename}"
screenshot_path = C:/Temp.png
file_read = FILESystem:READFile "{filename}"
file_delete = FILESystem:DELEte "{filename}"
save_setup = SAVe:SETUp "{filename}"
recall_setup = RECAll:SETUp "{filename}"

# === Math ===
math_display_on = DISplay:GLObal:MATH1:STATE ON
math_display_off = DISplay:GLObal:MATH1:STATE OFF
math_function = MATH:MATH1:DEFine "{function}"
math_get_function = MATH:MATH1:DEFine?

# === Cursor ===
cursor_mode = DISplay:WAVEView1:CURSor:CURSOR1:FUNCtion {mode}
cursor_get_mode = DISplay:WAVEView1:CURSor:CURSOR1:FUNCtion?
cursor_x1 = DISplay:WAVEView1:CURSor:CURSOR1:VBArs:APOSition {position}
cursor_get_x1 = DISplay:WAVEView1:CURSor:CURSOR1:VBArs:APOSition?
cursor_x2 = DISplay:WAVEView1:CURSor:CURSOR1:VBArs:BPOSition {position}
cursor_get_x2 = DISplay:WAVEView1:CURSor:CURSOR1:VBArs:BPOSition?
cursor_y1 = DISplay:WAVEView1:CURSor:CURSOR1:HBArs:APOSition {position}
cursor_get_y1 = DISplay:WAVEView1:CURSor:CURSOR1:HBArs:APOSition?
cursor_y2 = DISplay:WAVEView1:CURSor:CURSOR1:HBArs:BPOSition {position}
cursor_get_y2 = DISplay:WAVEView1:CURSor:CURSOR1:HBArs:BPOSition?
