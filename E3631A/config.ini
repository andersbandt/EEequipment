[serial]
baudrate = 9600
timeout = 2


[command]
; Channel selection must be sent before per-channel voltage/current commands.
; Use INST:NSEL with channel number 1 (P6V), 2 (P25V), or 3 (N25V).
select_channel = INST:NSEL {channel}
set_voltage = VOLT {value}
set_current = CURR {value}
get_set_voltage = VOLT?
get_set_current = CURR?
get_voltage = MEAS:VOLT?
get_current = MEAS:CURR?
; OUTP applies to all outputs simultaneously on the E3631A
output_on = OUTP ON
output_off = OUTP OFF
output_state = OUTP?
status = STAT:QUES?
query = *IDN?
reset = *RST
clear = *CLS
error = SYST:ERR?
