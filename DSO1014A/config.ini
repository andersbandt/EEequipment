[pyvisa]
timeout = 5000
write_termination = \n
read_termination = \n


[command]
# === System / IEEE 488.2 ===
query = *IDN?
reset = *RST
clear = *CLS
self_test = *TST?
error = :SYSTem:ERRor?
status = *ESE {mask}
opc = *OPC?
unlock_local = :KEY:LOCK DISabled

# === Autoscale ===
autoscale = :AUToscale

# === Channel ===
chan_display_on = :CHANnel{channel}:DISPlay ON
chan_display_off = :CHANnel{channel}:DISPlay OFF
chan_get_display = :CHANnel{channel}:DISPlay?
chan_coupling = :CHANnel{channel}:COUPling {coupling}
chan_get_coupling = :CHANnel{channel}:COUPling?
chan_scale = :CHANnel{channel}:SCALe {scale}
chan_get_scale = :CHANnel{channel}:SCALe?
chan_offset = :CHANnel{channel}:OFFSet {offset}
chan_get_offset = :CHANnel{channel}:OFFSet?
chan_probe = :CHANnel{channel}:PROBe {ratio}
chan_get_probe = :CHANnel{channel}:PROBe?
chan_bw_limit_on = :CHANnel{channel}:BWLimit ON
chan_bw_limit_off = :CHANnel{channel}:BWLimit OFF
chan_get_bw_limit = :CHANnel{channel}:BWLimit?
chan_impedance = :CHANnel{channel}:IMPedance {impedance}
chan_get_impedance = :CHANnel{channel}:IMPedance?
chan_label = :CHANnel{channel}:LABel "{label}"
chan_get_label = :CHANnel{channel}:LABel?

# === Timebase ===
timebase_scale = :TIMebase:SCALe {scale}
timebase_get_scale = :TIMebase:SCALe?
timebase_position = :TIMebase:POSition {position}
timebase_get_position = :TIMebase:POSition?
timebase_mode = :TIMebase:MODE {mode}
timebase_get_mode = :TIMebase:MODE?
timebase_ref = :TIMebase:REFerence {reference}
timebase_get_ref = :TIMebase:REFerence?

# === Trigger ===
trig_mode = :TRIGger:MODE {mode}
trig_get_mode = :TRIGger:MODE?
trig_source = :TRIGger:EDGE:SOURce {source}
trig_get_source = :TRIGger:EDGE:SOURce?
trig_level = :TRIGger:EDGE:LEVel {level},CHANnel{channel}
trig_get_level = :TRIGger:EDGE:LEVel? CHANnel{channel}
trig_slope = :TRIGger:EDGE:SLOPe {slope}
trig_get_slope = :TRIGger:EDGE:SLOPe?
trig_coupling = :TRIGger:EDGE:COUPling {coupling}
trig_get_coupling = :TRIGger:EDGE:COUPling?
trig_sweep = :TRIGger:SWEep {sweep}
trig_get_sweep = :TRIGger:SWEep?
trig_force = :TRIGger:FORCe

# === Acquisition ===
acq_run = :RUN
acq_stop = :STOP
acq_single = :SINGle
acq_type = :ACQuire:TYPE {acq_type}
acq_get_type = :ACQuire:TYPE?
acq_count = :ACQuire:COUNt {count}
acq_get_count = :ACQuire:COUNt?
acq_srate = :ACQuire:SRATe?
acq_points = :ACQuire:POINts {points}
acq_get_points = :ACQuire:POINts?

# === Measurements ===
measure_freq = :MEASure:FREQuency? CHANnel{channel}
measure_period = :MEASure:PERiod? CHANnel{channel}
measure_duty = :MEASure:DUTYcycle? CHANnel{channel}
measure_vpp = :MEASure:VPP? CHANnel{channel}
measure_vmax = :MEASure:VMAX? CHANnel{channel}
measure_vmin = :MEASure:VMIN? CHANnel{channel}
measure_vavg = :MEASure:VAVerage? CHANnel{channel}
measure_vrms = :MEASure:VRMS? DISPlay,AC,CHANnel{channel}
measure_vamplitude = :MEASure:VAMPlitude? CHANnel{channel}
measure_vtop = :MEASure:VTOP? CHANnel{channel}
measure_vbase = :MEASure:VBASe? CHANnel{channel}
measure_rise_time = :MEASure:RISetime? CHANnel{channel}
measure_fall_time = :MEASure:FALLtime? CHANnel{channel}
measure_overshoot = :MEASure:OVERshoot? CHANnel{channel}
measure_preshoot = :MEASure:PREShoot? CHANnel{channel}
measure_phase = :MEASure:PHASe? CHANnel{source1},CHANnel{source2}
measure_delay = :MEASure:DELay? CHANnel{source1},CHANnel{source2}
measure_counter = :MEASure:COUNter? CHANnel{channel}
measure_pos_width = :MEASure:PWIDth? CHANnel{channel}
measure_neg_width = :MEASure:NWIDth? CHANnel{channel}
measure_clear = :MEASure:CLEar

# === Waveform Data Transfer ===
wav_source = :WAVeform:SOURce CHANnel{channel}
wav_format = :WAVeform:FORMat {fmt}
wav_points_mode = :WAVeform:POINts:MODE {mode}
wav_points = :WAVeform:POINts {points}
wav_get_preamble = :WAVeform:PREamble?
wav_get_data = :WAVeform:DATA?

# === Display ===
display_clear = :CDISplay
display_persist_on = :DISPlay:PERSistence INFinite
display_persist_off = :DISPlay:PERSistence MINimum
display_get_persist = :DISPlay:PERSistence?
display_graticule = :DISPlay:GRATicule {style}
display_get_graticule = :DISPlay:GRATicule?

# === Save / Screenshot ===
save_image = :SAVE:IMAGe "{filename}"
save_setup = :SAVE:SETup "{filename}"
recall_setup = :RECall:SETup "{filename}"

# === Math ===
math_display_on = :MATH:DISPlay ON
math_display_off = :MATH:DISPlay OFF
math_function = :MATH:FUNCtion {function}
math_get_function = :MATH:FUNCtion?

# === Cursor ===
cursor_mode = :MARKer:MODE {mode}
cursor_get_mode = :MARKer:MODE?
cursor_x1 = :MARKer:X1Position {position}
cursor_get_x1 = :MARKer:X1Position?
cursor_x2 = :MARKer:X2Position {position}
cursor_get_x2 = :MARKer:X2Position?
cursor_y1 = :MARKer:Y1Position {position}
cursor_get_y1 = :MARKer:Y1Position?
cursor_y2 = :MARKer:Y2Position {position}
cursor_get_y2 = :MARKer:Y2Position?
