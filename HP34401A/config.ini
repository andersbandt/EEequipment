[serial]
baudrate = 9600
timeout = 2


[command]
; CONF commands configure function and enable auto-range in one shot.
; They also store the active mode so set_range() can issue the right SCPI path.
read = READ?
query = *IDN?
reset = *RST
clear = *CLS
mode_vdc = CONF:VOLT:DC
mode_vac = CONF:VOLT:AC
mode_idc = CONF:CURR:DC
mode_iac = CONF:CURR:AC
mode_res_2 = CONF:RES
mode_res_4 = CONF:FRES
get_mode = FUNC?
get_range = SENS:VOLT:DC:RANG?
; NPLC (power-line cycles) for DC voltage; override per mode in subclass if needed
sample_slow = SENS:VOLT:DC:NPLC 100
sample_medium = SENS:VOLT:DC:NPLC 10
sample_fast = SENS:VOLT:DC:NPLC 1
