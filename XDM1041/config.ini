[serial]
serial_port = COM3
baudrate = 115200
timeout = 0.5


[command]
read = MEAS1?
query = *IDN?
get_mode = FUNC1?
get_range = RANGE?
get_rate = RATE?
range_auto = AUTO
rate_slow = RATE S
rate_medium = RATE M
rate_fast = RATE F
get_func2 = FUNC2?
read_secondary = MEAS2?
set_func2 = FUNC2 "{mode}"


[capabilities]
secondary_display = true
