[serial]
serial_port = COM3
baudrate = 115200
timeout = 0.5


[command]
read = MEAS1?
query = *IDN?
get_mode = FUNC1?
get_range = RANGE?
get_rate = RATE?
range_auto = AUTO
rate_slow = RATE S
rate_medium = RATE M
rate_fast = RATE F
get_func2 = FUNC2?
read_secondary = MEAS2?
set_func2 = FUNC2 "{mode}"


set_range = RANGE {range}

range_1 = RANGE 1
range_2 = RANGE 2
range_3 = RANGE 3
range_4 = RANGE 4
range_5 = RANGE 5
range_6 = RANGE 6
range_7 = RANGE 7


[range_labels]
range_1 = 50mV / 500uA / 500Ω / 50nF
range_2 = 500mV / 5mA / 5V AC / 5kΩ / 500nF / PT100
range_3 = 5V / 50mA / 50V AC / 50kΩ / 5uF
range_4 = 50V / 500mA / 500V AC / 500kΩ / 50uF
range_5 = 500V / 5A / 750V AC / 5MΩ / 500uF
range_6 = 1000V / 10A / 50MΩ / 5mF
range_7 = 50mF


[capabilities]
secondary_display = true
